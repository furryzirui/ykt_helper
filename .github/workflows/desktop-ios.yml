name: Windows and iOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ios-background-diagnostics:
        description: Include temporary 10-second iOS background test logs
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Test Windows startup authorization
        shell: pwsh
        run: ./scripts/windows/test_autostart.ps1
      - run: flutter build windows --release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.5
      - name: Package Windows installer
        shell: pwsh
        env:
          INTEGRITY_SIGNING_KEY: ${{ secrets.INTEGRITY_SIGNING_KEY }}
        run: ./scripts/windows/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ykt-helper-windows
          path: dist/*windows*.exe
          if-no-files-found: error
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Test iOS continued-task configuration
        run: bash scripts/ios/test_continued_policy.sh
      - name: Build unsigned iOS app
        env:
          YKT_IOS_BACKGROUND_DIAGNOSTICS: ${{ inputs['ios-background-diagnostics'] && 'true' || 'false' }}
        run: flutter build ios --release --no-codesign --dart-define=YKT_IOS_BACKGROUND_DIAGNOSTICS=$YKT_IOS_BACKGROUND_DIAGNOSTICS
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.5
      - name: Package unsigned IPA
        env:
          INTEGRITY_SIGNING_KEY: ${{ secrets.INTEGRITY_SIGNING_KEY }}
        run: bash scripts/ios/package_unsigned.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ykt-helper-ios-unsigned
          path: dist/*ios-unsigned.ipa
          if-no-files-found: error
