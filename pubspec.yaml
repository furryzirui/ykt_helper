name: ykt_helper
description: 普通版雨课堂非官方辅助工具
publish_to: none
version: 1.1.2+20
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.9.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.3.0
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  webview_flutter: ^4.13.0
  share_plus: ^12.0.1
  image_picker: ^1.2.1
  url_launcher: ^6.3.2
  archive: ^4.0.7
  uuid: ^4.5.1
  mobile_scanner: ^7.1.3
  flutter_html: ^3.0.0
  html: 0.15.5
  webview_windows: 0.4.0
  file_selector: 1.0.4
  crypto: ^3.0.6
  cryptography: ^2.7.0
dev_dependencies:
  path_provider_platform_interface: ^2.1.2
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
dependency_overrides:
  # flutter_html 3.0 uses the selector helper removed by html 0.15.6+.
  html: 0.15.5
flutter:
  uses-material-design: true
